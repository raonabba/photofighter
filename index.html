<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:#0a1628;font-family:'Noto Sans KR',sans-serif;color:#fff;user-select:none;-webkit-user-select:none}

/* ── Overlays ── */
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80;transition:opacity .3s}
.ov.hide{opacity:0;pointer-events:none}
#scr-load{background:#0a1628;z-index:100;gap:16px}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.1);border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite}

/* Name screen */
#scr-name{background:radial-gradient(ellipse at 50% 40%,#1a3a5c,#0a1628 70%);gap:14px;padding:28px 24px;text-align:center;z-index:90}
.globe{font-size:64px;animation:float 3s ease-in-out infinite;line-height:1}
.big-title{font-size:28px;font-weight:900;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.name-in{width:100%;max-width:280px;padding:13px 18px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:14px;font-size:18px;font-weight:700;font-family:'Noto Sans KR',sans-serif;color:#fff;text-align:center;outline:none;transition:border-color .2s}
.name-in:focus{border-color:#60a5fa}
.name-in::placeholder{color:rgba(255,255,255,.3);font-weight:400}
.hint-rules{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:11px 16px;font-size:13px;color:rgba(255,255,255,.6);line-height:1.85;text-align:left;max-width:290px;width:100%}

/* Game Over */
#scr-go{background:rgba(8,16,30,.98);z-index:85;flex-direction:column;overflow:hidden;justify-content:flex-start;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.go-top{flex-shrink:0;padding:20px 20px 14px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
#go-ttl{font-size:22px;font-weight:900;margin-bottom:5px}
#go-stat{font-size:13px;color:rgba(255,255,255,.6)}
.sec-hdr{flex-shrink:0;padding:9px 16px 3px;font-size:10px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1.2px;text-transform:uppercase}
#ans-list{flex:1;overflow-y:auto;padding:0 10px 8px;-webkit-overflow-scrolling:touch}
.ar{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;margin-bottom:3px;font-size:13px}
.ar.ok{background:rgba(74,222,128,.07)}
.ar.ng{background:rgba(248,113,113,.07)}
.ar-nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar.ok .ar-nm{color:#86efac}
.ar.ng .ar-nm{color:#fca5a5}
.ar-arr{color:rgba(255,255,255,.25)}
.ar-cap{flex-shrink:0;font-size:12px;color:rgba(255,255,255,.8);min-width:80px;text-align:right}
.bot-foot{flex-shrink:0;padding:10px 20px 18px;text-align:center;border-top:1px solid rgba(255,255,255,.07)}

/* Victory */
#scr-vic{background:radial-gradient(ellipse at 50% 40%,#1a3a28,#0a1628 70%);z-index:85;gap:14px;padding:32px 24px;text-align:center}
#vic-ico{font-size:68px;animation:float 2s ease-in-out infinite;line-height:1}
#vic-ttl{font-size:26px;font-weight:900;background:linear-gradient(135deg,#4ade80,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#vic-msg{font-size:14px;color:rgba(255,255,255,.7);line-height:1.6;max-width:270px}
#vic-stat{font-size:15px;font-weight:700;color:#fbbf24}

/* Button */
.btn{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border:none;border-radius:50px;padding:12px 34px;font-size:17px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 4px 20px rgba(59,130,246,.4);transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.95)}

#ghdr{flex-shrink:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(10,22,40,.97);border-bottom:1px solid rgba(255,255,255,.08);gap:6px}

#h-score{font-size:12px;font-weight:700;color:#4ade80}
#h-wrong{font-size:12px;font-weight:700;color:#f87171}

#map-area{flex:1;position:relative;overflow:hidden;min-height:0}
#world-svg{width:100%;height:100%;display:block}
.cp{pointer-events:none;transition:fill .4s}
.cp.cur{stroke:#fbbf24!important;stroke-width:2px!important;animation:pulse 1.2s ease-in-out infinite}
#mleg{position:absolute;top:6px;left:6px;display:flex;flex-direction:column;gap:2px;background:rgba(8,18,34,.82);border-radius:7px;padding:5px 8px;pointer-events:none}

.ld{width:7px;height:7px;border-radius:50%;flex-shrink:0}

// ── Confetti ──────────────────────────
function confetti(){
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;z-index:999;pointer-events:none';
  cv.width=innerWidth;cv.height=innerHeight;
  document.body.appendChild(cv);
  const ctx=cv.getContext('2d');
  const cols=['#4ade80','#60a5fa','#f59e0b','#f87171','#a78bfa','#fbbf24','#2dd4bf'];
  const ps=Array.from({length:110},()=>{
    const a=Math.random()*Math.PI*2,s=Math.random()*13+5;
    return{x:innerWidth/2,y:innerHeight*.42,vx:Math.cos(a)*s,vy:Math.sin(a)*s-7,
      w:Math.random()*10+4,h:Math.random()*5+3,rot:Math.random()*6.28,rv:(Math.random()-.5)*.3,
      c:cols[0|Math.random()*cols.length],g:.22};
  });
  const t0=Date.now(),dur=2000;
  (function fr(){
    ctx.clearRect(0,0,cv.width,cv.height);
    const t=Date.now()-t0,al=Math.max(0,1-t/dur*1.3);
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.rv;
      ctx.save();ctx.globalAlpha=al;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    t<dur?requestAnimationFrame(fr):cv.remove();
  })();
}

// ── Map ───────────────────────────────

  async function init(wrap){
    W=wrap.clientWidth;H=wrap.clientHeight;
    svg=d3.select('#world-svg').attr('viewBox',`0 0 ${W} ${H}`);
    proj=d3.geoNaturalEarth1().fitExtent(mg(),{type:'Sphere'});
    gpath=d3.geoPath().projection(proj);
    const topo=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    const defs=svg.append('defs');
    clip=defs.append('clipPath').attr('id','sc').append('path').datum({type:'Sphere'}).attr('d',gpath);
    const g=svg.append('g').attr('clip-path','url(#sc)');
    ocean=g.append('path').datum({type:'Sphere'}).attr('d',gpath).style('fill',OCEAN).attr('pointer-events','none');
    grat=g.append('path').datum(d3.geoGraticule()()).attr('d',gpath).attr('fill','none').attr('stroke','rgba(255,255,255,.04)').attr('stroke-width','.4').attr('pointer-events','none');
    const feats=topojson.feature(topo,topo.objects.countries).features.filter(d=>d.id!==10);
    cpaths=g.selectAll('.cp').data(feats).enter().append('path').attr('class','cp').attr('d',gpath).style('fill',UNSEEN).attr('stroke','rgba(255,255,255,.18)').attr('stroke-width','.4');
    borders=g.append('path').datum(topojson.mesh(topo,topo.objects.countries,(a,b)=>a!==b)).attr('d',gpath).attr('fill','none').attr('stroke','rgba(255,255,255,.08)').attr('stroke-width','.3').attr('pointer-events','none');
    ring=svg.append('path').datum({type:'Sphere'}).attr('d',gpath).attr('fill','none').attr('stroke','rgba(100,180,255,.3)').attr('stroke-width','1').attr('pointer-events','none');
    let t;new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(resize,150);}).observe(wrap);
  }
  function resize(){
    const w=document.getElementById('map-area');W=w.clientWidth;H=w.clientHeight;
    svg.attr('viewBox',`0 0 ${W} ${H}`);
    proj.fitExtent(mg(),{type:'Sphere'});
    [clip,ocean,grat,borders,ring].forEach(el=>el&&el.attr('d',gpath));
    cpaths&&cpaths.attr('d',gpath);
  }
  function flashOk(id,col){
    const p=cpaths&&cpaths.filter(d=>String(d.id)===id);
    if(!p||p.empty())return;
    p.style('fill','#fff');
    setTimeout(()=>p.transition().duration(600).style('fill',col),100);
  }
  function setCur(id){cpaths&&cpaths.classed('cur',d=>String(d.id)===id);}
  function clearCur(){cpaths&&cpaths.classed('cur',false);}
  function resetAll(){cpaths&&cpaths.interrupt().style('fill',UNSEEN).classed('cur',false);}
  return{init,flashOk,setCur,clearCur,resetAll};
})();

// ── Game State ────────────────────────
let pname='',qs=[],idx=0,done=new Set(),wrongs=0,locked=false;

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}

function choices(q){return shuf([q,...shuf(COUNTRIES.filter(c=>c.id!==q.id)).slice(0,4)]);}

function startGame(name){
  pname=name;qs=shuf([...COUNTRIES]);idx=0;done.clear();wrongs=0;locked=false;
  MAP.resetAll();
  document.getElementById('h-name').textContent='👤 '+name;
  updHdr();
  document.getElementById('gw').style.display='flex';
  showQ();
}

function showQ(){
  locked=false;
  const q=qs[idx];
  document.getElementById('q-ctry').textContent=q.name;
  setFb('','');
  MAP.setCur(q.id);
  const grid=document.getElementById('cards');
  grid.innerHTML='';
  choices(q).forEach(c=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<div class="ce">${c.emoji}</div><div class="ct">${c.capital}</div>`;
    el.addEventListener('click',()=>onCard(c,el,q));
    grid.appendChild(el);
  });
}

function onCard(choice,el,q){
  if(locked)return;
  if(choice.id===q.id){
    locked=true;
    el.classList.add('ok');
    MAP.clearCur();
    MAP.flashOk(q.id,CC[q.cont]);
    confetti();
    setFb(`🎉 정답! ${q.name} → ${q.capital}`,'ok');
    done.add(q.id);
    updHdr();
    setTimeout(()=>{
      idx++;
      idx>=qs.length?victory():showQ();
    },1400);
  }else{
    wrongs++;
    el.classList.add('ng');
    setFb(`❌ 아쉬워요! 다시 찾아보세요 (${wrongs}/${MAX_WRONG})`,'ng');
    updHdr();
    setTimeout(()=>{
      el.classList.remove('ng');
      if(wrongs>=MAX_WRONG){locked=true;gameOver();}
    },650);
  }
}

function updHdr(){
  document.getElementById('h-score').textContent=`정답 ${done.size} / ${COUNTRIES.length}`;
  document.getElementById('h-wrong').textContent=`❌ ${wrongs} / ${MAX_WRONG}`;
  document.getElementById('mprog').textContent=`${done.size} / ${COUNTRIES.length} ✅`;
}

function setFb(txt,cls){
  const el=document.getElementById('q-fb');
  el.textContent=txt;el.className=cls;
}

function gameOver(){
  MAP.clearCur();
  document.getElementById('go-ttl').innerHTML=`📚 ${pname}님, 공부해볼까요?`;
  document.getElementById('go-stat').textContent=`${wrongs}번 틀렸어요 · 맞힌 나라 ${done.size}개 / ${COUNTRIES.length}개`;
  const list=document.getElementById('ans-list');list.innerHTML='';
  [...COUNTRIES.filter(c=>done.has(c.id)),...COUNTRIES.filter(c=>!done.has(c.id))].forEach(c=>{
    const ok=done.has(c.id);
    const row=document.createElement('div');row.className='ar '+(ok?'ok':'ng');
    row.innerHTML=`<span>${ok?'✅':'❌'}</span><span class="ar-nm">${c.emoji} ${c.name}</span><span class="ar-arr">→</span><span class="ar-cap">${c.capital}</span>`;
    list.appendChild(row);
  });
  show('scr-go');
}

function victory(){
  MAP.clearCur();
  confetti();setTimeout(confetti,700);
  document.getElementById('vic-ttl').textContent=`🎉 ${pname}님, 완벽해요!`;
  document.getElementById('vic-msg').innerHTML=`모든 ${COUNTRIES.length}개 나라의 수도를 다 맞혔어요!<br>당신은 진정한 지리왕이에요! 🌍`;
  document.getElementById('vic-stat').textContent=`정답 ${COUNTRIES.length}개 · 오답 ${wrongs}회`;
  show('scr-vic');
}

function restart(){
  hide('scr-go');hide('scr-vic');
  document.getElementById('name-in').value=pname;
  show('scr-name');
}

function show(id){document.getElementById(id).classList.remove('hide');}
function hide(id){document.getElementById(id).classList.add('hide');}

// ── Boot ──────────────────────────────
(async()=>{
  try{
    await MAP.init(document.getElementById('map-area'));
    hide('scr-load');show('scr-name');
  }catch(e){
    console.error(e);
    document.getElementById('scr-load').innerHTML='<p style="color:#f87171;text-align:center;padding:24px;font-size:14px">지도를 불러올 수 없어요.<br>인터넷 연결을 확인해주세요.<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 22px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">다시 시도</button></p>';
  }
  const ni=document.getElementById('name-in');
  document.getElementById('btn-go').addEventListener('click',()=>{
    const n=ni.value.trim()||'무명 탐험가';
    hide('scr-name');startGame(n);
  });
  ni.addEventListener('keydown',e=>e.key==='Enter'&&document.getElementById('btn-go').click());
  document.getElementById('btn-retry-go').addEventListener('click',restart);
  document.getElementById('btn-retry-vic').addEventListener('click',restart);
})();
</script>
