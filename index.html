<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>세계 수도 퀴즈 🌍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  display:flex;flex-direction:column;
  height:100dvh;overflow:hidden;
  background:#0a1628;
  font-family:'Noto Sans KR',sans-serif;
  color:#fff;user-select:none;-webkit-user-select:none;
}

/* ── Header ─────────────────────────────── */
#game-header{
  display:none;flex-shrink:0;height:52px;
  align-items:center;justify-content:space-between;
  padding:0 14px;
  background:rgba(10,22,40,0.97);
  border-bottom:1px solid rgba(255,255,255,0.1);
  z-index:10;
}
.hdr-title{font-size:13px;font-weight:700;color:#93c5fd}
.score-col{display:flex;flex-direction:column;align-items:center;gap:3px}
#score-disp{font-size:12px;font-weight:700;color:#fbbf24}
#prog-bar{width:90px;height:4px;background:rgba(255,255,255,0.12);border-radius:2px;overflow:hidden}
#prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#4ade80,#22c55e);transition:width .4s ease;border-radius:2px}
#lives-disp{font-size:18px;letter-spacing:2px}

/* ── Map ───────────────────────────────── */
#map-wrap{flex:1;position:relative;overflow:hidden}
#world-svg{width:100%;height:100%;display:block;touch-action:none}
.cpath{cursor:pointer}
.cpath:hover{opacity:.8}

/* ── Question Card ──────────────────────── */
#qcard{
  display:none;
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(8,18,34,.98) 72%,transparent);
  padding:14px 20px max(22px,env(safe-area-inset-bottom));
  text-align:center;z-index:20;pointer-events:none;
}
.q-label{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
#cap-name{font-size:30px;font-weight:900;line-height:1.1;margin-bottom:4px}
#cap-name.pop{animation:popIn .28s ease-out both}
.q-hint{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:6px}
#fb-msg{font-size:13px;font-weight:700;min-height:20px}
#fb-msg.ok{color:#4ade80}
#fb-msg.ng{color:#f87171}
#fb-msg.pop{animation:popIn .28s ease-out both}

/* ── Legend ─────────────────────────────── */
#legend{
  display:none;position:absolute;top:8px;left:8px;
  flex-direction:column;gap:3px;
  background:rgba(8,18,34,.82);border-radius:8px;padding:7px 10px;
  z-index:15;pointer-events:none;
}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,.65)}
.ld{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ── Overlay screens ────────────────────── */
.overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:90;transition:opacity .35s ease;
}
.overlay.hide{opacity:0;pointer-events:none}

/* Loading */
#scr-load{background:#0a1628;z-index:100;gap:18px}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.12);border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite}
.load-txt{font-size:15px;color:rgba(255,255,255,.45)}

/* Start */
#scr-start{background:radial-gradient(ellipse at 50% 40%,#1a3a5c,#0a1628 70%);gap:14px;padding:28px 24px;text-align:center}
.globe-ico{font-size:68px;animation:float 3s ease-in-out infinite;line-height:1}
.s-title{font-size:30px;font-weight:900;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.s-sub{font-size:14px;color:rgba(255,255,255,.5);line-height:1.7;max-width:260px}
.rules{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 16px;font-size:13px;color:rgba(255,255,255,.65);line-height:1.9;text-align:left;max-width:290px;width:100%}

/* End */
#scr-end{
  background:rgba(8,16,30,.98);z-index:92;
  flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  justify-content:flex-start;
}
.end-hdr{flex-shrink:0;padding:22px 20px 14px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
#end-rank{font-size:26px;font-weight:900;margin-bottom:3px}
#end-stars{font-size:20px;letter-spacing:4px;margin-bottom:6px}
#end-score{font-size:19px;font-weight:700;color:#fbbf24;margin-bottom:6px}
#end-enc{font-size:13px;color:rgba(255,255,255,.7);line-height:1.6;max-width:310px;margin:0 auto}
.list-hdr{flex-shrink:0;padding:10px 16px 4px;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px;text-transform:uppercase}
#end-list{flex:1;overflow-y:auto;padding:0 10px 8px;-webkit-overflow-scrolling:touch}
.cr{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;margin-bottom:3px;font-size:13px}
.cr.ok{background:rgba(74,222,128,.07)}
.cr.ng{background:rgba(248,113,113,.07)}
.cr-name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr.ok .cr-name{color:#86efac}
.cr.ng .cr-name{color:#fca5a5}
.cr-arr{color:rgba(255,255,255,.25);flex-shrink:0}
.cr-cap{flex-shrink:0;color:rgba(255,255,255,.8);font-size:12px;text-align:right;min-width:70px}
.end-foot{flex-shrink:0;padding:10px 20px 18px;text-align:center;border-top:1px solid rgba(255,255,255,.07)}

/* Button */
.btn{
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  color:#fff;border:none;border-radius:50px;
  padding:13px 38px;font-size:17px;font-weight:700;
  font-family:'Noto Sans KR',sans-serif;cursor:pointer;
  box-shadow:0 4px 22px rgba(59,130,246,.4);
  transition:transform .15s,box-shadow .15s;
}
.btn:active{transform:scale(.96);box-shadow:0 2px 10px rgba(59,130,246,.3)}

/* Keyframes */
@keyframes spin  {to{transform:rotate(360deg)}}
@keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes popIn {0%{transform:scale(.65);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<!-- Loading -->
<div class="overlay" id="scr-load">
  <div class="spin"></div>
  <p class="load-txt">세계지도 불러오는 중…</p>
</div>

<!-- Start -->
<div class="overlay hide" id="scr-start">
  <div class="globe-ico">🌍</div>
  <h1 class="s-title">세계 수도 퀴즈</h1>
  <p class="s-sub">수도 이름을 보고<br>지도에서 나라를 찾아보세요!</p>
  <div class="rules">
    🎯 수도 이름이 화면에 표시됩니다<br>
    🗺️ 지도에서 해당 나라를 클릭하세요<br>
    ❤️ 목숨 3개 — 틀리면 하나씩 줄어요<br>
    🌟 총 71개 나라의 수도를 완파하세요!
  </div>
  <button class="btn" id="btn-start">게임 시작</button>
</div>

<!-- End -->
<div class="overlay hide" id="scr-end">
  <div class="end-hdr">
    <div id="end-rank"></div>
    <div id="end-stars"></div>
    <div id="end-score"></div>
    <div id="end-enc"></div>
  </div>
  <div class="list-hdr">나라 ↔ 수도 정답표</div>
  <div id="end-list"></div>
  <div class="end-foot">
    <button class="btn" id="btn-retry">다시 도전 🚀</button>
  </div>
</div>

<!-- Game Header -->
<header id="game-header">
  <span class="hdr-title">🌍 수도 퀴즈</span>
  <div class="score-col">
    <span id="score-disp">0 / 71</span>
    <div id="prog-bar"><div id="prog-fill"></div></div>
  </div>
  <div id="lives-disp">❤️❤️❤️</div>
</header>

<!-- Map -->
<div id="map-wrap">
  <svg id="world-svg"></svg>
  <div id="legend">
    <div class="li"><div class="ld" style="background:#4ade80"></div>아메리카</div>
    <div class="li"><div class="ld" style="background:#a78bfa"></div>유럽</div>
    <div class="li"><div class="ld" style="background:#fb923c"></div>아시아</div>

    <div class="li"><div class="ld" style="background:#2dd4bf"></div>오세아니아</div>
  </div>

<div id="qcard">

  <p class="q-hint">지도에서 나라를 클릭하세요</p>

// ══════════════════════════════════════
// MAP MODULE
// ══════════════════════════════════════
const MAP = (() => {
  let svg, proj, path, cpaths;
  let W, H, clickCb = null;

  function margins() {
    return [[20, 14], [W - 20, H - 145]];
  }

  async function init(wrap) {
    W = wrap.clientWidth;
    H = wrap.clientHeight;

    svg = d3.select('#world-svg').attr('viewBox', `0 0 ${W} ${H}`);
    proj = d3.geoNaturalEarth1().fitExtent(margins(), {type:'Sphere'});
    path = d3.geoPath().projection(proj);

    const topo = await d3.json(
      'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'
    );

    const defs = svg.append('defs');
    defs.append('clipPath').attr('id','sclip')
      .append('path').datum({type:'Sphere'}).attr('d', path);

    const g = svg.append('g').attr('clip-path','url(#sclip)');

    g.append('path').datum({type:'Sphere'})
      .attr('d', path).style('fill', OCEAN).attr('pointer-events','none');

    g.append('path').datum(d3.geoGraticule()())
      .attr('d', path).attr('fill','none')
      .attr('stroke','rgba(255,255,255,.04)').attr('stroke-width','.5')
      .attr('pointer-events','none');

    const feats = topojson.feature(topo, topo.objects.countries).features
      .filter(d => d.id !== 10);

    cpaths = g.selectAll('.cpath').data(feats).enter()
      .append('path').attr('class','cpath')
      .attr('d', path).style('fill', UNSEEN)
      .attr('stroke','rgba(255,255,255,.22)').attr('stroke-width','.5')
      .on('click', (e, d) => { if(clickCb) clickCb(String(d.id)); })
      .on('touchstart', function(e, d) {
        e.preventDefault();
        if(clickCb) clickCb(String(d.id));
      }, {passive:false});

    g.append('path')
      .datum(topojson.mesh(topo, topo.objects.countries, (a,b) => a!==b))
      .attr('d', path).attr('fill','none')
      .attr('stroke','rgba(255,255,255,.1)').attr('stroke-width','.3')
      .attr('pointer-events','none');

    svg.append('path').datum({type:'Sphere'})
      .attr('d', path).attr('fill','none')
      .attr('stroke','rgba(100,180,255,.35)').attr('stroke-width','1.2')
      .attr('pointer-events','none');

    let t;
    new ResizeObserver(() => { clearTimeout(t); t = setTimeout(resize, 160); })
      .observe(wrap);
  }

  function resize() {
    const wrap = document.getElementById('map-wrap');
    W = wrap.clientWidth; H = wrap.clientHeight;
    svg.attr('viewBox', `0 0 ${W} ${H}`);
    proj.fitExtent(margins(), {type:'Sphere'});
    svg.selectAll('path').attr('d', path);
  }

  function flashOk(id, finalColor) {
    const p = cpaths && cpaths.filter(d => String(d.id) === id);
    if(!p || p.empty()) return;
    p.style('fill','#86efac');
    setTimeout(() => p.transition().duration(550).style('fill', finalColor), 120);
  }

  function flashNg(id) {
    const p = cpaths && cpaths.filter(d => String(d.id) === id);
    if(!p || p.empty()) return;
    p.style('fill','#ef4444');
    setTimeout(() => p.transition().duration(480).style('fill', UNSEEN), 340);
  }

  function reset() {
    cpaths && cpaths.interrupt().style('fill', UNSEEN);
  }

  function onClick(fn) { clickCb = fn; }

  return {init, flashOk, flashNg, reset, onClick};
})();

// ══════════════════════════════════════
// UI MODULE
// ══════════════════════════════════════
const UI = (() => {
  const $ = id => document.getElementById(id);

  const show = id => $(id).classList.remove('hide');
  const hide = id => $(id).classList.add('hide');

  function showGame() {
    $('game-header').style.display = 'flex';
    $('qcard').style.display = 'block';
    $('legend').style.display = 'flex';
  }

  function setCapital(txt) {
    const el = $('cap-name');
    el.classList.remove('pop'); void el.offsetWidth;
    el.textContent = txt;
    el.classList.add('pop');
  }

  function feedback(txt, type) {
    const el = $('fb-msg');
    el.classList.remove('pop','ok','ng'); void el.offsetWidth;
    el.textContent = txt;
    el.className = 'pop ' + type;
  }

  function clearFb() { $('fb-msg').textContent=''; $('fb-msg').className=''; }

  function score(s, t) { $('score-disp').textContent = `${s} / ${t}`; }

  function lives(n) {
    $('lives-disp').textContent = '❤️'.repeat(Math.max(0,n)) + '🖤'.repeat(Math.max(0,3-n));
  }

  function progress(i, t) {
    $('prog-fill').style.width = (t ? Math.round(i/t*100) : 0) + '%';
  }

  function getRank(s, t) {
    const p = s/t;
    if(p===1)   return {title:'지리왕 👑',     stars:5, enc:'완벽합니다! 당신은 세계 최강의 지리왕이에요! 정말 놀라워요! 🏆'};
    if(p>=0.85) return {title:'지리마스터 🌍', stars:4, enc:'훌륭해요! 거의 다 맞혔어요! 조금만 더 하면 지리왕이 될 수 있어요! 💪'};
    if(p>=0.65) return {title:'탐험가 🧭',     stars:3, enc:'좋은 실력이에요! 세계를 향한 열정이 느껴져요. 계속 도전해봐요! 🌟'};
    if(p>=0.42) return {title:'여행자 ✈️',     stars:2, enc:'더 공부해봐요! 세계를 알아가는 즐거움을 느껴보세요. 파이팅! 🚀'};
    if(p>=0.21) return {title:'지도 초보 🗺️', stars:1, enc:'계속 도전하세요! 한 번에 완벽할 필요 없어요. 반복하면 느는 거예요! ⭐'};
    return             {title:'지리 신입 📚',  stars:0, enc:'처음부터 다시 도전해봐요! 당신도 분명 잘 할 수 있어요! 화이팅! 🔥'};
  }

  function endScreen(s, t, answered, questions) {
    const r = getRank(s, t);
    $('end-rank').textContent  = r.title;
    $('end-stars').textContent = '⭐'.repeat(r.stars) + '☆'.repeat(5-r.stars);
    $('end-score').textContent = `${s} / ${t} 정답`;
    $('end-enc').textContent   = r.enc;

    const list = $('end-list');
    list.innerHTML = '';
    // correct first, then missed
    [...questions.filter(q => answered.has(q.id)),
     ...questions.filter(q => !answered.has(q.id))].forEach(q => {
      const ok = answered.has(q.id);
      const div = document.createElement('div');
      div.className = 'cr ' + (ok ? 'ok' : 'ng');
      div.innerHTML =
        `<span>${ok ? '✅' : '❌'}</span>` +
        `<span class="cr-name">${q.name}</span>` +
        `<span class="cr-arr">→</span>` +
        `<span class="cr-cap">${q.capital}</span>`;
      list.appendChild(div);
    });

    show('scr-end');
  }

  return {show, hide, showGame, setCapital, feedback, clearFb, score, lives, progress, endScreen};
})();

// ══════════════════════════════════════
// GAME MODULE
// ══════════════════════════════════════
const GAME = (() => {
  let qs=[], idx=0, sc=0, lv=3, answered=new Set(), locked=false, playing=false;

  function shuffle(a) {
    const b = [...a];
    for(let i=b.length-1; i>0; i--) {
      const j = 0|Math.random()*(i+1);
      [b[i],b[j]] = [b[j],b[i]];
    }
    return b;
  }

  function start() {
    qs=shuffle(COUNTRIES); idx=0; sc=0; lv=3;
    answered=new Set(); locked=false; playing=true;

    MAP.reset();
    UI.hide('scr-start'); UI.hide('scr-end');
    UI.showGame();
    UI.score(0, qs.length);
    UI.lives(3);
    UI.progress(0, qs.length);
    ask(qs[0]);
  }

  function ask(q) {
    UI.setCapital(q.capital);
    UI.clearFb();
    locked = false;
  }

  function click(fid) {
    if(locked || !playing) return;
    locked = true;
    const q = qs[idx];
    fid === q.id ? correct(q) : wrong(fid);
  }

  function correct(q) {
    sc++; answered.add(q.id);
    MAP.flashOk(q.id, CONT_COLOR[q.cont]);
    UI.feedback(`🎉 정답! ${q.name}`, 'ok');
    UI.score(sc, qs.length);
    UI.progress(idx+1, qs.length);
    setTimeout(next, 1100);
  }

  function wrong(fid) {
    lv--;
    MAP.flashNg(fid);
    UI.feedback('❌ 틀렸어요! 다시 찾아보세요', 'ng');
    UI.lives(lv);
    setTimeout(() => { lv<=0 ? end() : (locked=false); }, 950);
  }

  function next() {
    idx++;
    idx >= qs.length ? end() : ask(qs[idx]);
  }

  function end() {
    playing = false;
    UI.endScreen(sc, qs.length, answered, qs);
  }

  return {start, click};
})();

// ══════════════════════════════════════
// BOOT
// ══════════════════════════════════════
(async () => {
  try {
    await MAP.init(document.getElementById('map-wrap'));
    MAP.onClick(id => GAME.click(id));
    document.getElementById('scr-load').classList.add('hide');
    UI.show('scr-start');
  } catch(e) {
    console.error(e);
    document.getElementById('scr-load').innerHTML =
      '<p style="color:#f87171;text-align:center;padding:24px;font-size:15px">' +
      '지도를 불러올 수 없어요.<br>인터넷 연결을 확인해주세요.<br>' +
      '<button onclick="location.reload()" style="margin-top:14px;padding:10px 22px;' +
      'background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">' +
      '다시 시도</button></p>';
  }

  document.getElementById('btn-start').addEventListener('click', () => GAME.start());
  document.getElementById('btn-retry').addEventListener('click', () => {
    UI.hide('scr-end');
    GAME.start();
  });
})();
</script>
